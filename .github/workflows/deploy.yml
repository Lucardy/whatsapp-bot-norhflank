name: Deploy to VPS

# Este workflow se ejecuta cuando haces push a la rama main
on:
  push:
    branches:
      - main  # Cambia esto si tu rama principal se llama diferente (master, etc)

jobs:
  deploy:
    name: Desplegar en VPS
    runs-on: ubuntu-latest
    
    steps:
      # Paso 1: Verificar el código (checkout)
      - name: Obtener código del repositorio
        uses: actions/checkout@v4
      
      # Paso 2: Configurar SSH y desplegar
      - name: Conectar al VPS y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Estos valores vienen de los secrets de GitHub (los configuramos después)
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navegar al directorio del proyecto
            cd ~/whatsapp-bot-norhflank || cd /opt/whatsapp-bot-norhflank || cd /var/www/whatsapp-bot-norhflank
            
            # Obtener los últimos cambios de GitHub
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master
            git clean -fd
            
            # Instalar dependencias
            npm install --production --no-audit --no-fund
            
            # Generar Prisma Client
            npx prisma generate
            
            # Ejecutar migraciones (si hay cambios)
            npx prisma migrate deploy || echo "No hay migraciones pendientes"
            
            # Reiniciar el bot con PM2
            if command -v pm2 &> /dev/null; then
              if pm2 list | grep -q "whatsapp-bot"; then
                pm2 restart whatsapp-bot
              else
                pm2 start src/index.js --name "whatsapp-bot" -- --skip-menu
              fi
              pm2 save
            fi
            
            echo "✅ Despliegue completado exitosamente!"
